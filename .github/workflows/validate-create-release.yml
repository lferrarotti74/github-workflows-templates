name: Validate: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create (e.g., v0.0.1-tests)'
        required: true
        type: string
      dry_run:
        description: 'Dry run mode (default true)'
        required: false
        type: boolean
        default: true
      force:
        description: 'Force overwrite existing tag (default false)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  validate:
    uses: lferrarotti74/github-workflows-templates/.github/workflows/create-release.yml@f8bc09c52e7987bcbf510a531307a41d352e3b37
    with:
      tag: ${{ inputs.tag }}
      dry_run: ${{ inputs.dry_run }}
      force: ${{ inputs.force }}