name: Build Extended (Reusable)

on:
  workflow_call:
    inputs:
      image_name:
        description: "Docker image name (e.g., speedtest-ookla)"
        required: true
        type: string
      arch_list:
        description: "Comma-separated list of target architectures (e.g., linux/amd64,linux/arm64)"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      enable_push:
        description: "Push built images to registries"
        required: false
        type: boolean
        default: true
      env_file_path:
        description: "Path to .env file (optional, e.g., env/.env)"
        required: false
        type: string
        default: "env/.env"
      version_var_name:
        description: "Name of version variable in .env file (optional)"
        required: false
        type: string
        default: "SPEEDTEST_VERSION"
      enable_ghcr:
        description: "Also tag and push to GHCR"
        required: false
        type: boolean
        default: true
      enable_security_scan:
        description: "Run post-build security scans (Trivy)"
        required: false
        type: boolean
        default: true
      enable_sonar_scan:
        description: "Run SonarQube analysis"
        required: false
        type: boolean
        default: false
      sonar_project_key:
        description: "SonarQube project key (when sonar scan enabled)"
        required: false
        type: string
        default: ""
      sonar_organization:
        description: "SonarQube organization (when sonar scan enabled)"
        required: false
        type: string
        default: ""
      enable_base_update_detection:
        description: "Detect Alpine base image updates on schedule runs"
        required: false
        type: boolean
        default: true

    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      SONAR_TOKEN:
        required: false
      REPO_TOKEN:
        description: "PAT with repo scope for repo variables API"
        required: false

jobs:
  check-base-image:
    name: Check Alpine Base Update
    runs-on: ubuntu-latest
    if: inputs.enable_base_update_detection == true
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.check.outputs.should_build || steps.default.outputs.should_build }}
      update_reason: ${{ steps.check.outputs.update_reason || steps.default.outputs.update_reason }}
      alpine_digest: ${{ steps.check.outputs.digest || steps.default.outputs.digest }}
    steps:
      - name: Decide default behavior for non-schedule events
        id: default
        run: |
          echo "should_build=true" >> $GITHUB_OUTPUT
          echo "update_reason=Non-scheduled trigger" >> $GITHUB_OUTPUT
          echo "digest=" >> $GITHUB_OUTPUT
      - name: Check Alpine digest (only on schedule)
        id: check
        if: github.event_name == 'schedule'
        run: |
          set -e
          echo "🔍 Checking Alpine Linux for updates..."
          NEW_DIGEST=$(docker manifest inspect alpine:latest | jq -r '.config.digest // .digest // empty')
          if [ -z "$NEW_DIGEST" ] || [ "$NEW_DIGEST" = "null" ]; then
            echo "Trying alternative digest retrieval..."
            docker pull alpine:latest > /dev/null 2>&1 || true
            NEW_DIGEST=$(docker image inspect alpine:latest --format '{{index .RepoDigests 0}}' | cut -d'@' -f2)
          fi
          if [[ ! "$NEW_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "⚠️ Invalid Alpine digest: $NEW_DIGEST"
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "update_reason=Failed to retrieve valid Alpine digest" >> $GITHUB_OUTPUT
            echo "digest=" >> $GITHUB_OUTPUT
            exit 0
          fi
          STORED_DIGEST="${{ vars.ALPINE_DIGEST }}"
          echo "Stored Alpine digest: $STORED_DIGEST"
          echo "Current Alpine digest: $NEW_DIGEST"
          if [ -z "$STORED_DIGEST" ] || [ "$STORED_DIGEST" = "sha256:initial" ]; then
            echo "🆕 First run — build proceeds."
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "update_reason=First run - initializing Alpine digest tracking" >> $GITHUB_OUTPUT
            echo "digest=$NEW_DIGEST" >> $GITHUB_OUTPUT
          elif [ "$NEW_DIGEST" != "$STORED_DIGEST" ]; then
            echo "✅ Alpine updated — build proceeds."
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "update_reason=Alpine base updated (${STORED_DIGEST:0:12}... → ${NEW_DIGEST:0:12}...)" >> $GITHUB_OUTPUT
            echo "digest=$NEW_DIGEST" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ No Alpine update detected — skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "update_reason=No Alpine update detected" >> $GITHUB_OUTPUT
            echo "digest=$NEW_DIGEST" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build and Push (Docker)
    runs-on: ubuntu-latest
    needs: [check-base-image]
    if: github.event_name != 'schedule' || needs.check-base-image.outputs.should_build == 'true'
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
      PUSH_ENABLED: ${{ inputs.enable_push }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.2.0
        with:
          fetch-depth: 0

      - name: Check if .env file exists
        id: check-env
        env:
          ENV_FILE_PATH: ${{ inputs.env_file_path }}
        run: |
          if [ -f "$ENV_FILE_PATH" ]; then
            echo "env_exists=true" >> $GITHUB_OUTPUT
          else
            echo "env_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set Environment from .env
        if: steps.check-env.outputs.env_exists == 'true'
        uses: c-py/action-dotenv-to-setenv@925b5d99a3f1e4bd7b4e9928be4e2491e29891d9 # v5
        id: source-env
        with:
          env-file: ${{ inputs.env_file_path }}

      - name: Set version from .env
        if: steps.check-env.outputs.env_exists == 'true'
        env:
          VERSION_VAR_NAME: ${{ inputs.version_var_name }}
          ENV_FILE_PATH: ${{ inputs.env_file_path }}
        run: |
          VERSION_VALUE=$(grep "^$VERSION_VAR_NAME=" "$ENV_FILE_PATH" | cut -d'=' -f2 | tr -d '"' || echo "")
          if [ -n "$VERSION_VALUE" ]; then
            echo "VERSION=$VERSION_VALUE" >> $GITHUB_ENV
          fi

      - name: Fallback version to short Git SHA
        if: env.VERSION == ''
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "VERSION=$SHORT_SHA" >> $GITHUB_ENV

      - name: Setup QEMU (multi-arch)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: inputs.enable_ghcr == true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ${{ env.REGISTRY_IMAGE }}
            ${{ inputs.enable_ghcr && format('ghcr.io/{0}/{1}', github.repository_owner, inputs.image_name) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            ${{ github.event_name == 'schedule' && format('alpine.base.updated={0}', needs.check-base-image.outputs.alpine_digest) || '' }}
          tags: |
            type=edge,branch=$repo.default_branch
            type=semver,pattern=v{{version}}
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.VERSION }},enable=${{ inputs.enable_push }}
            type=raw,value=alpine-update-{{date 'YYYY-MM-DD'}},enable=${{ github.event_name == 'schedule' && needs.check-base-image.outputs.should_build == 'true' }}

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ inputs.arch_list }}
          build-args: |
            VERSION=${{ env.VERSION }}
          push: ${{ inputs.enable_push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache,mode=max

  security-scan:
    name: Security Scan (Trivy + Grype + OSV)
    runs-on: ubuntu-latest
    needs: [build]
    if: inputs.enable_security_scan == true && github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
    env:
      REGISTRY_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}
    outputs:
      trivy_critical: ${{ steps.parse-metrics.outputs.trivy_critical }}
      trivy_high: ${{ steps.parse-metrics.outputs.trivy_high }}
      trivy_medium: ${{ steps.parse-metrics.outputs.trivy_medium }}
      trivy_low: ${{ steps.parse-metrics.outputs.trivy_low }}
      secrets_count: ${{ steps.parse-metrics.outputs.secrets_count }}
      grype_critical: ${{ steps.parse-metrics.outputs.grype_critical }}
      grype_high: ${{ steps.parse-metrics.outputs.grype_high }}
      grype_medium: ${{ steps.parse-metrics.outputs.grype_medium }}
      grype_low: ${{ steps.parse-metrics.outputs.grype_low }}
      osv_findings: ${{ steps.parse-metrics.outputs.osv_findings }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest image
        run: docker pull ${REGISTRY_IMAGE}:latest

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.5
        with:
          version: 'v0.69.2'  # Use this version as suggested in https://github.com/aquasecurity/setup-trivy/issues/30

      - name: Cache Trivy DB
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ hashFiles('**/Dockerfile') }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-${{ hashFiles('**/Dockerfile') }}-
            trivy-db-${{ runner.os }}-

      - name: Run Trivy vulnerability scan (table)
        run: |
          trivy image \
            --format table \
            --output trivy-report.txt \
            --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 0 \
            ${REGISTRY_IMAGE}:latest

      - name: Run Trivy vulnerability scan (JSON)
        run: |
          trivy image \
            --format json \
            --output trivy-report.json \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --exit-code 0 \
            ${REGISTRY_IMAGE}:latest

      - name: Run Trivy vulnerability scan (SARIF)
        run: |
          trivy image \
            --format sarif \
            --output trivy-report.sarif \
            --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 0 \
            ${REGISTRY_IMAGE}:latest

      - name: Run Trivy secret scan
        run: |
          trivy image \
            --scanners secret \
            --format table \
            --output trivy-secrets.txt \
            --exit-code 0 \
            ${REGISTRY_IMAGE}:latest
          trivy image \
            --scanners secret \
            --format json \
            --output trivy-secrets.json \
            --exit-code 0 \
            ${REGISTRY_IMAGE}:latest

      - name: Setup Grype
        run: |
          set -e
          curl --proto "=https" --tlsv1.2 -sSfL https://raw.githubusercontent.com/anchore/grype/3e8647396b9b201136afe07a30b98cd5850dcc64/install.sh | sh -s -- -b /usr/local/bin
          grype version || true

      - name: Run Grype vulnerability scan (JSON)
        run: |
          grype ${REGISTRY_IMAGE}:latest -o json > grype-report.json || true

      - name: Install Syft (SBOM generator)
        run: |
          curl --proto "=https" --tlsv1.2 -sSfL https://raw.githubusercontent.com/anchore/syft/c94d1ccf1c6219da41cf1ad01c9c8473d62fdc12/install.sh | sh
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Generate SBOM
        run: syft ${REGISTRY_IMAGE}:latest -o json > sbom.json || echo '{"artifacts":[]}' > sbom.json

      - name: Setup OSV Scanner
        run: |
          set -e
          OSV_VERSION=v1.7.3
          curl --proto "=https" --tlsv1.2 -sSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner --version || true

      - name: Run OSV Scanner on Container Image (JSON)
        run: |
          ./osv-scanner --image ${REGISTRY_IMAGE}:latest --format=json --output=osv-report.json || true
          # Ensure the report file exists even if the scan fails or outputs elsewhere
          if [ ! -f "osv-report.json" ]; then
            echo '{"results":[]}' > osv-report.json
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: security-reports
          path: |
            trivy-report.txt
            trivy-report.sarif
            trivy-report.json
            trivy-secrets.txt
            trivy-secrets.json
            grype-report.json
            sbom.json
            osv-report.json
          retention-days: 30

      - name: Parse security metrics
        id: parse-metrics
        run: |
          set -e
          # Trivy vulnerability counts by severity
          TRIVY_CRIT=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-report.json 2>/dev/null || echo 0)
          TRIVY_HIGH=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-report.json 2>/dev/null || echo 0)
          TRIVY_MED=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-report.json 2>/dev/null || echo 0)
          TRIVY_LOW=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-report.json 2>/dev/null || echo 0)

          # Trivy secret findings
          SECRETS_COUNT=$(jq '[(.Results[]? | (.Secrets // []) | length), (.Results[]? | (.Findings // []) | length)] | add // 0' trivy-secrets.json 2>/dev/null || echo 0)

          # Grype vulnerability counts by severity
          GRYPE_CRIT=$(jq '[.matches[]? | select(.vulnerability.severity=="Critical")] | length' grype-report.json 2>/dev/null || echo 0)
          GRYPE_HIGH=$(jq '[.matches[]? | select(.vulnerability.severity=="High")] | length' grype-report.json 2>/dev/null || echo 0)
          GRYPE_MED=$(jq '[.matches[]? | select(.vulnerability.severity=="Medium")] | length' grype-report.json 2>/dev/null || echo 0)
          GRYPE_LOW=$(jq '[.matches[]? | select(.vulnerability.severity=="Low")] | length' grype-report.json 2>/dev/null || echo 0)

          # OSV findings count
          OSV_FINDINGS=$(jq '[.results[]? | (.vulnerabilities // []) | length] | add // 0' osv-report.json 2>/dev/null || echo 0)

          echo "trivy_critical=$TRIVY_CRIT" >> $GITHUB_OUTPUT
          echo "trivy_high=$TRIVY_HIGH" >> $GITHUB_OUTPUT
          echo "trivy_medium=$TRIVY_MED" >> $GITHUB_OUTPUT
          echo "trivy_low=$TRIVY_LOW" >> $GITHUB_OUTPUT
          echo "secrets_count=$SECRETS_COUNT" >> $GITHUB_OUTPUT
          echo "grype_critical=$GRYPE_CRIT" >> $GITHUB_OUTPUT
          echo "grype_high=$GRYPE_HIGH" >> $GITHUB_OUTPUT
          echo "grype_medium=$GRYPE_MED" >> $GITHUB_OUTPUT
          echo "grype_low=$GRYPE_LOW" >> $GITHUB_OUTPUT
          echo "osv_findings=$OSV_FINDINGS" >> $GITHUB_OUTPUT

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@c793b717bc78562f491db7b0e93a3a178b099162 # v4.32.5
        with:
          sarif_file: trivy-report.sarif
          category: trivy-container-scan

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [check-base-image, build, security-scan]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.2.0
        with:
          fetch-depth: 0

      - name: Check if .env file exists
        id: check-env
        env:
          ENV_FILE_PATH: ${{ inputs.env_file_path }}
        run: |
          if [ -f "$ENV_FILE_PATH" ]; then
            echo "env_exists=true" >> $GITHUB_OUTPUT
          else
            echo "env_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set Environment from .env
        if: steps.check-env.outputs.env_exists == 'true'
        uses: c-py/action-dotenv-to-setenv@925b5d99a3f1e4bd7b4e9928be4e2491e29891d9 # v5
        with:
          env-file: ${{ inputs.env_file_path }}

      - name: Set version from .env
        if: steps.check-env.outputs.env_exists == 'true'
        env:
          VERSION_VAR_NAME: ${{ inputs.version_var_name }}
          ENV_FILE_PATH: ${{ inputs.env_file_path }}
        run: |
          VERSION_VALUE=$(grep "^$VERSION_VAR_NAME=" "$ENV_FILE_PATH" | cut -d'=' -f2 | tr -d '"' || echo "")
          if [ -n "$VERSION_VALUE" ]; then
            echo "VERSION=$VERSION_VALUE" >> $GITHUB_ENV
          fi

      - name: Fallback version to short Git SHA
        if: env.VERSION == ''
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "VERSION=$SHORT_SHA" >> $GITHUB_ENV

      - name: Write build summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPDATE_REASON: ${{ needs.check-base-image.outputs.update_reason }}
          ALPINE_DIGEST: ${{ needs.check-base-image.outputs.alpine_digest }}
          BUILD_STATUS: ${{ needs.build.result }}
          SCAN_STATUS: ${{ needs.security-scan.result }}
          TRIVY_CRIT: ${{ needs.security-scan.outputs.trivy_critical }}
          TRIVY_HIGH: ${{ needs.security-scan.outputs.trivy_high }}
          TRIVY_MED: ${{ needs.security-scan.outputs.trivy_medium }}
          TRIVY_LOW: ${{ needs.security-scan.outputs.trivy_low }}
          SECRETS_COUNT: ${{ needs.security-scan.outputs.secrets_count }}
          GRYPE_CRIT: ${{ needs.security-scan.outputs.grype_critical }}
          GRYPE_HIGH: ${{ needs.security-scan.outputs.grype_high }}
          GRYPE_MED: ${{ needs.security-scan.outputs.grype_medium }}
          GRYPE_LOW: ${{ needs.security-scan.outputs.grype_low }}
          OSV_FINDINGS: ${{ needs.security-scan.outputs.osv_findings }}
          REGISTRY_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}
          GHCR_ENABLED: ${{ inputs.enable_ghcr }}
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
          ARCH_LIST: ${{ inputs.arch_list }}
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** $EVENT_NAME" >> $GITHUB_STEP_SUMMARY
          echo "**Build Status:** $BUILD_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "**Security Scan:** $SCAN_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "**Architectures:** $ARCH_LIST" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images Built:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`$REGISTRY_IMAGE:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$REGISTRY_IMAGE:${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          if [ "$GHCR_ENABLED" = "true" ]; then
            echo "- \`$GHCR_IMAGE:latest\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`$GHCR_IMAGE:${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ -n "$ALPINE_DIGEST" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Schedule Reason:** $UPDATE_REASON" >> $GITHUB_STEP_SUMMARY
              echo "**New Alpine Digest:** \`$ALPINE_DIGEST\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Schedule:** No Alpine update detected" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$SCAN_STATUS" = "success" ]; then
            echo "### Security Reports" >> $GITHUB_STEP_SUMMARY
            echo "- Trivy: \`trivy-report.txt\`, \`trivy-report.sarif\` (SARIF uploaded to Code scanning)" >> $GITHUB_STEP_SUMMARY
            echo "- Trivy Secrets: \`trivy-secrets.txt\`" >> $GITHUB_STEP_SUMMARY
            echo "- SBOM (Syft): \`sbom.json\`" >> $GITHUB_STEP_SUMMARY
            echo "- Grype: \`grype-report.json\`" >> $GITHUB_STEP_SUMMARY
            echo "- OSV: \`osv-report.json\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Security Findings" >> $GITHUB_STEP_SUMMARY
            echo "- Trivy CVEs: critical=$TRIVY_CRIT, high=$TRIVY_HIGH, medium=$TRIVY_MED, low=$TRIVY_LOW" >> $GITHUB_STEP_SUMMARY
            echo "- Trivy Secrets: findings=$SECRETS_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- Grype CVEs: critical=$GRYPE_CRIT, high=$GRYPE_HIGH, medium=$GRYPE_MED, low=$GRYPE_LOW" >> $GITHUB_STEP_SUMMARY
            echo "- OSV entries: $OSV_FINDINGS" >> $GITHUB_STEP_SUMMARY
          fi

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    if: inputs.enable_sonar_scan == true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.2.0
        with:
          fetch-depth: 0
      - name: Cache SonarQube packages
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Prepare SonarQube arguments
        id: sonar-args
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          SONAR_PROJECT_KEY: ${{ inputs.sonar_project_key }}
          SONAR_ORGANIZATION: ${{ inputs.sonar_organization }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "args=-Dsonar.projectKey=$SONAR_PROJECT_KEY \
                  -Dsonar.organization=$SONAR_ORGANIZATION \
                  -Dsonar.pullrequest.key=$PR_NUMBER \
                  -Dsonar.pullrequest.branch=$HEAD_REF \
                  -Dsonar.pullrequest.base=$BASE_REF" >> $GITHUB_OUTPUT
          else
            echo "args=-Dsonar.projectKey=$SONAR_PROJECT_KEY \
                  -Dsonar.organization=$SONAR_ORGANIZATION \
                  -Dsonar.branch.name=$REF_NAME" >> $GITHUB_OUTPUT
          fi
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: ${{ steps.sonar-args.outputs.args }}

  update-digest:
    name: Update Stored Base Digest
    runs-on: ubuntu-latest
    needs: [check-base-image, build]
    if: inputs.enable_base_update_detection == true && github.event_name == 'schedule' && needs.build.result == 'success' && needs.check-base-image.outputs.alpine_digest != ''
    permissions:
      contents: write
      actions: write
    steps:
      - name: Patch ALPINE_DIGEST repository variable
        env:
          NEW_DIGEST: ${{ needs.check-base-image.outputs.alpine_digest }}
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          OWNER_REPO: ${{ github.repository }}
        run: |
          set -e
          VAR_NAME="ALPINE_DIGEST"
          echo "Updating repo variable $VAR_NAME to $NEW_DIGEST"
          HTTP_CODE=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$OWNER_REPO/actions/variables/$VAR_NAME" \
            -d "{\"name\": \"$VAR_NAME\", \"value\": \"$NEW_DIGEST\"}")
          if [ "$HTTP_CODE" = "204" ]; then
            echo "Variable updated (HTTP 204)"
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "Variable not found; creating $VAR_NAME"
            CREATE_CODE=$(curl -sS -o /tmp/create_resp.json -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$OWNER_REPO/actions/variables" \
              -d "{\"name\": \"$VAR_NAME\", \"value\": \"$NEW_DIGEST\"}")
            if [ "$CREATE_CODE" = "201" ]; then
              echo "Variable created (HTTP 201)"
            else
              echo "Create failed with HTTP $CREATE_CODE:"
              cat /tmp/create_resp.json
              exit 1
            fi
          else
            echo "PATCH failed with HTTP $HTTP_CODE:"
            cat /tmp/resp.json
            exit 1
          fi
          
