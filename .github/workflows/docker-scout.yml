name: Docker Scout Scan (Reusable)

on:
  workflow_call:
    inputs:
      image_name:
        description: "Docker image name to scan (e.g., myrepo/myimage)"
        required: true
        type: string
      compare_tag:
        description: "Tag to compare against (default: latest)"
        required: false
        type: string
        default: "latest"
      env_file_path:
        description: "Path to .env file (optional, e.g., .env, env/.env)"
        required: false
        type: string
        default: ".env"
      version_var_name:
        description: "Name of version variable in .env file (optional)"
        required: false
        type: string
        default: "VERSION"
      fail_on_vulnerabilities:
        description: "Fail the job if Scout finds a vulnerability at or above only-severities"
        required: false
        type: boolean
        default: false
      organization:
        description: "Docker Scout organization (empty uses the org tied to the Docker Hub login)"
        required: false
        type: string
        default: ""
      enable_policy_evaluation:
        description: "Run Docker Scout Policy Evaluation as an extra step in the scout job"
        required: false
        type: boolean
        default: false
      policy_exit_code:
        description: "Fail the job if the image is non-compliant with policies"
        required: false
        type: boolean
        default: false
      policy_config_path:
        description: "Path to a custom policy config JSON file (empty uses built-in policies)"
        required: false
        type: string
        default: ""

    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  scout:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}  # system-provided token
      REGISTRY: docker.io
      IMAGE_NAME: ${{ inputs.image_name }}
      COMPARE_TAG: ${{ inputs.compare_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.2.0
        with:
          fetch-depth: 0

      - name: Check if .env file exists
        id: check-env
        env:
          ENV_FILE_PATH: ${{ inputs.env_file_path }}
        run: |
          if [ -f "$ENV_FILE_PATH" ]; then
            echo "env_exists=true" >> $GITHUB_OUTPUT
          else
            echo "env_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set Environment from .env
        if: steps.check-env.outputs.env_exists == 'true'
        uses: c-py/action-dotenv-to-setenv@925b5d99a3f1e4bd7b4e9928be4e2491e29891d9 # v5
        id: source-env
        with:
          env-file: ${{ inputs.env_file_path }}

      - name: Set version from .env
        if: steps.check-env.outputs.env_exists == 'true'
        env:
          VERSION_VAR_NAME: ${{ inputs.version_var_name }}
          ENV_FILE_PATH: ${{ inputs.env_file_path }}
        run: |
          VERSION_VALUE=$(grep "^$VERSION_VAR_NAME=" "$ENV_FILE_PATH" | cut -d'=' -f2 | tr -d '"' || echo "")
          if [ -n "$VERSION_VALUE" ]; then
            echo "BUILD_VERSION=$VERSION_VALUE" >> $GITHUB_ENV
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver: docker-container  # required for cache-to: type=registry

      - name: Log into registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            type=edge,branch=$repo.default_branch
            type=semver,pattern=v{{version}}
            type=sha,prefix=,suffix=,format=short

      - name: Lowercase Docker image name
        run: |
          IMAGE_LC=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_LC=$IMAGE_LC" >> $GITHUB_ENV

      - name: Check Dockerfile presence
        id: check-dockerfile
        run: |
          if [ -f "Dockerfile" ]; then
            echo "has_dockerfile=true" >> $GITHUB_OUTPUT
          else
            echo "has_dockerfile=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        id: build-and-push
        if: steps.check-dockerfile.outputs.has_dockerfile == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            ${{ env.BUILD_VERSION && format('VERSION={0}', env.BUILD_VERSION) || '' }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:buildcache,mode=max

      - name: Set image reference for Scout
        id: set-image-ref
        env:
          HAS_DOCKERFILE: ${{ steps.check-dockerfile.outputs.has_dockerfile }}
          GENERATED_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ "$HAS_DOCKERFILE" = "true" ]; then
            FIRST_TAG=$(echo "$GENERATED_TAGS" | head -n1)
            echo "IMAGE_REF=$FIRST_TAG" >> $GITHUB_ENV
            echo "Using built image tag: $FIRST_TAG"
          else
            REMOTE_REF="$REGISTRY/$IMAGE_LC:$COMPARE_TAG"
            echo "IMAGE_REF=$REMOTE_REF" >> $GITHUB_ENV
            echo "No Dockerfile found; analyzing remote image: $REMOTE_REF"
          fi

      - name: Docker Scout (PR compare)
        if: github.event_name == 'pull_request' && steps.check-dockerfile.outputs.has_dockerfile == 'true'
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves,recommendations,compare
          image: ${{ env.IMAGE_REF }}
          to: ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:${{ env.COMPARE_TAG }}
          ignore-base: true
          ignore-unchanged: true
          only-severities: critical,high,medium
          only-fixed: true
          write-comment: true
          github-token: ${{ env.GITHUB_TOKEN }}
          organization: ${{ inputs.organization }}
          exit-code: ${{ inputs.fail_on_vulnerabilities }}

      - name: Docker Scout (analyze remote)
        if: github.event_name != 'pull_request' || steps.check-dockerfile.outputs.has_dockerfile != 'true'
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves,recommendations
          image: ${{ env.IMAGE_REF }}
          ignore-base: true
          ignore-unchanged: true
          only-severities: critical,high,medium
          only-fixed: true
          organization: ${{ inputs.organization }}
          exit-code: ${{ inputs.fail_on_vulnerabilities }}

      - name: Ensure Docker Scout CLI
        if: ${{ !cancelled() && inputs.enable_policy_evaluation == true && steps.build-and-push.outcome != 'failure' }}
        env:
          SCOUT_VERSION: 1.24.0
        run: |
          if docker scout version >/dev/null 2>&1; then
            echo "docker scout already available"
          else
            ASSET="docker-scout_${SCOUT_VERSION}_linux_amd64.tar.gz"
            BASE="https://github.com/docker/scout-cli/releases/download/v${SCOUT_VERSION}"
            curl --proto "=https" --tlsv1.2 -fsSLO "$BASE/$ASSET"
            curl --proto "=https" --tlsv1.2 -fsSLO "$BASE/docker-scout_${SCOUT_VERSION}_checksums.txt"
            grep " $ASSET\$" "docker-scout_${SCOUT_VERSION}_checksums.txt" | sha256sum -c -
            mkdir -p "$HOME/.docker/cli-plugins"
            tar -xzf "$ASSET" -C "$HOME/.docker/cli-plugins" docker-scout
            chmod +x "$HOME/.docker/cli-plugins/docker-scout"
          fi
          docker scout version

      - name: Docker Scout (policy evaluation)
        if: ${{ !cancelled() && inputs.enable_policy_evaluation == true && steps.build-and-push.outcome != 'failure' }}
        env:
          SCOUT_ORG: ${{ inputs.organization }}
          POLICY_CONFIG_PATH: ${{ inputs.policy_config_path }}
          POLICY_EXIT_CODE: ${{ inputs.policy_exit_code }}
        run: |
          ARGS=()
          [ -n "$SCOUT_ORG" ] && ARGS+=(--org "$SCOUT_ORG")
          [ -n "$POLICY_CONFIG_PATH" ] && ARGS+=(--policy-config "$POLICY_CONFIG_PATH")
          [ "$POLICY_EXIT_CODE" = "true" ] && ARGS+=(--exit-code)
          echo "Evaluating policies for $IMAGE_REF"
          docker scout policy "$IMAGE_REF" "${ARGS[@]}"
