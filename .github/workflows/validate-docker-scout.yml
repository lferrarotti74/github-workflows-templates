name: Validate: Docker Scout

on:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    permissions:
      contents: read
      pull-requests: write
    uses: lferrarotti74/github-workflows-templates/.github/workflows/docker-scout.yml@f8bc09c52e7987bcbf510a531307a41d352e3b37
    with:
      image_name: lferrarotti74/speedtest-ookla
      compare_tag: latest
      env_file_path: env/.env
      version_var_name: SPEEDTEST_VERSION
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}