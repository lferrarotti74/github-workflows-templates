name: "Validate: Docker Scout"

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Docker image to scan (e.g., owner/name)'
        required: false
        type: string
        default: 'lferrarotti74/speedtest-ookla'
      compare_tag:
        description: 'Tag to compare against'
        required: false
        type: string
        default: 'latest'
      env_file_path:
        description: 'Path to .env file (optional)'
        required: false
        type: string
        default: 'env/.env'
      version_var_name:
        description: 'Version variable name in .env (optional)'
        required: false
        type: string
        default: 'SPEEDTEST_VERSION'
      run_policy_gate_test:
        description: 'Also run the negative policy-gate test (its called job is expected to fail, so the run ends red)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  precheck:
    name: Precheck Secrets
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check Docker Hub secrets presence
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Secrets present: proceeding with validation"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Secrets missing: will run diagnostic instead"
          fi

  validate:
    needs: [precheck]
    if: needs.precheck.outputs.should_run == 'true'
    uses: lferrarotti74/github-workflows-templates/.github/workflows/docker-scout.yml@main
    with:
      image_name: ${{ inputs.image_name }}
      compare_tag: ${{ inputs.compare_tag }}
      env_file_path: ${{ inputs.env_file_path }}
      version_var_name: ${{ inputs.version_var_name }}
      enable_policy_evaluation: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Negative test: busybox:1.28 has no provenance/SBOM attestations and runs as root,
  # so with policy_exit_code=true the called job must fail. continue-on-error is not
  # supported on reusable-workflow jobs, so the run itself ends red when this is enabled;
  # assert_policy_gate reports whether the failure was the expected one.
  validate_policy_gate:
    needs: [precheck]
    if: needs.precheck.outputs.should_run == 'true' && inputs.run_policy_gate_test
    uses: lferrarotti74/github-workflows-templates/.github/workflows/docker-scout.yml@main
    with:
      image_name: library/busybox
      compare_tag: '1.28'
      enable_policy_evaluation: true
      policy_exit_code: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  assert_policy_gate:
    needs: [validate_policy_gate]
    if: always() && needs.validate_policy_gate.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Assert policy gate failed the job
        env:
          RESULT: ${{ needs.validate_policy_gate.result }}
        run: |
          if [ "$RESULT" = "failure" ]; then
            echo "OK: policy_exit_code=true failed the job as expected (busybox:1.28 violates default policies)."
          else
            echo "::error::Expected validate_policy_gate to fail but result was '$RESULT'; the policy gate is not working."
            exit 1
          fi

  diagnostic:
    needs: [precheck]
    if: needs.precheck.outputs.should_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain skipped validation
        run: |
          echo "## Docker Scout validation skipped" >> $GITHUB_STEP_SUMMARY
          echo "Reason: Docker Hub secrets not configured." >> $GITHUB_STEP_SUMMARY
          echo "Required secrets: \`DOCKERHUB_USERNAME\`, \`DOCKERHUB_TOKEN\`." >> $GITHUB_STEP_SUMMARY
          echo "Configure repo secrets and re-run via 'Run workflow'." >> $GITHUB_STEP_SUMMARY
