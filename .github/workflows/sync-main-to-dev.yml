name: Sync Main Updates to Dev (Reusable)

on:
  workflow_call:
    inputs:
      source_branch:
        description: "Branch to sync from (default: main)"
        required: false
        type: string
        default: "main"
      target_branch:
        description: "Branch to sync into (default: dev)"
        required: false
        type: string
        default: "dev"

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.2.0
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Add authenticated remote
        env:
          REPO_NAME: ${{ github.repository }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO_NAME}.git"

      - name: Determine if merge is needed
        id: need
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git fetch origin $SOURCE_BRANCH
          if git merge-base --is-ancestor origin/$SOURCE_BRANCH $TARGET_BRANCH; then
            echo "needs_merge=false" >> $GITHUB_OUTPUT
          else
            echo "needs_merge=true" >> $GITHUB_OUTPUT
          fi

      - name: Merge source into target
        if: steps.need.outputs.needs_merge == 'true'
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -e
          git checkout $TARGET_BRANCH
          git merge origin/$SOURCE_BRANCH --no-ff -m "chore: sync $SOURCE_BRANCH into $TARGET_BRANCH"

      - name: Push changes
        if: steps.need.outputs.needs_merge == 'true'
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: git push origin $TARGET_BRANCH

      - name: Skip merge
        if: steps.need.outputs.needs_merge == 'false'
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          echo "No merge needed: $TARGET_BRANCH already contains $SOURCE_BRANCH"
