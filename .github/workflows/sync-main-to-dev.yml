name: Sync Main Updates to Dev (Reusable)

on:
  workflow_call:
    inputs:
      source_branch:
        description: "Branch to sync from (default: main)"
        required: false
        type: string
        default: "main"
      target_branch:
        description: "Branch to sync into (default: dev)"
        required: false
        type: string
        default: "dev"

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.2.0
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Add authenticated remote
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

      - name: Determine if merge is needed
        id: need
        run: |
          git fetch origin ${{ inputs.source_branch }}
          if git merge-base --is-ancestor origin/${{ inputs.source_branch }} ${{ inputs.target_branch }}; then
            echo "needs_merge=false" >> $GITHUB_OUTPUT
          else
            echo "needs_merge=true" >> $GITHUB_OUTPUT
          fi

      - name: Merge source into target
        if: steps.need.outputs.needs_merge == 'true'
        run: |
          set -e
          git checkout ${{ inputs.target_branch }}
          git merge origin/${{ inputs.source_branch }} --no-ff -m "chore: sync ${{ inputs.source_branch }} into ${{ inputs.target_branch }}"

      - name: Push changes
        if: steps.need.outputs.needs_merge == 'true'
        run: git push origin ${{ inputs.target_branch }}

      - name: Skip merge
        if: steps.need.outputs.needs_merge == 'false'
        run: |
          echo "No merge needed: ${{ inputs.target_branch }} already contains ${{ inputs.source_branch }}"
