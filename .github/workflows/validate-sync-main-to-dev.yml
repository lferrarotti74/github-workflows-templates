name: "Validate: Sync Main to Target"

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch to sync from (default: main)'
        required: false
        type: string
        default: 'main'
      target_branch:
        description: 'Branch to sync into (default: main)'
        required: false
        type: string
        default: 'main'

permissions:
  contents: write

jobs:
  validate:
    uses: lferrarotti74/github-workflows-templates/.github/workflows/sync-main-to-dev.yml@c6c4b658fe885031fd727cd2305563cae44ab8a2
    with:
      source_branch: ${{ inputs.source_branch }}
      target_branch: ${{ inputs.target_branch }}