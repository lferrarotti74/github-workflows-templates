name: Validate: Sync Main to Target

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch to sync from (default: main)'
        required: false
        type: string
        default: 'main'
      target_branch:
        description: 'Branch to sync into (default: main)'
        required: false
        type: string
        default: 'main'

permissions:
  contents: write

jobs:
  validate:
    uses: lferrarotti74/github-workflows-templates/.github/workflows/sync-main-to-dev.yml@f8bc09c52e7987bcbf510a531307a41d352e3b37
    with:
      source_branch: ${{ inputs.source_branch }}
      target_branch: ${{ inputs.target_branch }}